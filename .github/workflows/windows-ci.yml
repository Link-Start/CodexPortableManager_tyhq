name: Windows 验证

on:
  push:
  pull_request:

jobs:
  release-validation:
    name: Release 构建与回归
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验 PowerShell 语法
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              $allErrors += '{0}:{1}:{2}: {3}' -f `
                $_.FullName,
                $parseError.Extent.StartLineNumber,
                $parseError.Extent.StartColumnNumber,
                $parseError.Message
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: 构建 Release
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: 运行隔离回归
        shell: pwsh
        run: ./scripts/tests/Run-RegressionTests.ps1

      - name: 运行离线 Store 与网络专项
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "store-network-report.txt"
          & ./dist/tests/CodexPortableManager.Tests.exe --store-resolver-test $report off
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $report) {
              Get-Content -LiteralPath $report
            }
            exit $LASTEXITCODE
          }
          Get-Content -LiteralPath $report

      - name: 验证路径自动刷新
        shell: pwsh
        run: ./scripts/tests/Run-PathAutoRefreshTest.ps1
